<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true}'>
  <title>{% block title %}newsroom{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/site.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body hx-boost="true">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">newsroom</a>
      <nav aria-label="Main">
        <ul>
          <li><a href="/">Feed</a></li>
          <li><a href="/outlets">Outlets</a></li>
          <li><a href="/owners">Owners</a></li>
          <li><a href="/about">About</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>Ownership and funding shown only where a public record exists, each linked to its source.</p>
    </div>
  </footer>
</body>
</html>
