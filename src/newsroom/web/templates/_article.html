<li class="article">
  <a class="title" href="{{ a.url }}" target="_blank" rel="noopener noreferrer">{{ a.title }}</a>
  <div class="meta">
    <a class="outlet" href="/?{{ filters.params(outlet=a.outlet_domain) | qs }}">{{ a.outlet_name }}</a>
    <time datetime="{{ a.published.isoformat() }}">{{ a.published.strftime('%H:%M') }}</time>
    {% if a.tags %}
    <ul class="tags" aria-label="Tags">
      {% for slug, label in a.tags %}
      <li><a href="/?{{ filters.params(tag=slug) | qs }}">{{ label }}</a></li>
      {% endfor %}
    </ul>
    {% endif %}
  </div>
</li>
