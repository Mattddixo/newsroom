# Outlets to ingest. Edit freely; the worker re-reads this file on every run.
#   domain:   the outlet's web domain (subdomains are included automatically)
#   name:     display name
#   country:  ISO 3166-1 alpha-2 (CA, US, ...)
#   language: ISO 639-1 (en, fr, ...)
#   also:     optional list of other domains the outlet publishes articles on (after a
#             rebrand, or a second site); articles there count as this outlet's
#   feeds:    optional list of the outlet's own RSS/Atom feeds, read every 15 minutes as
#             a second source (for outlets GDELT doesn't carry). Test with: make feeds
#   note:     optional text shown on the outlet's page, e.g. why it has no articles
# Removing an entry stops ingestion for it; its existing articles are kept.
# Check your edits with: docker compose exec worker newsroom config check
# See which outlets GDELT actually carries, and under which addresses: make coverage
#
# Addresses reviewed 2026-09-24: MSNBC is MS NOW at ms.now since 2025-11-15 (msnbc.com
# kept for older links); ABC News serves articles from abcnews.com as well as
# abcnews.go.com; PBS NewsHour's digital brand is "PBS News" (still pbs.org).

outlets:
  # --- Canada: national and broadcast (English) ---
  - {domain: cbc.ca,                 name: CBC News,                  country: CA, language: en}
  - {domain: ctvnews.ca,             name: CTV News,                  country: CA, language: en,
     note: "Few articles: GDELT carries little of CTV News, and CTV News publishes no RSS feeds (per its FAQ)."}
  - {domain: globalnews.ca,          name: Global News,               country: CA, language: en}
