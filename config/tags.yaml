# Topic tags. Each article gets its tags from one of two sources, in this order:
#
#   gdelt:    GDELT's theme coding of the article's full text (GKG themes). The tag
#             applies when these themes are mentioned at least gdelt_min_mentions times
#             in total, so a passing mention doesn't count. Names must be exact; the
#             full list: http://data.gdeltproject.org/api/v2/guides/LOOKUP-GKGTHEMES.TXT
#   sections: the outlet's own section / topic labels on the article page (article:section,
#             article:tag, articleSection...), for articles GDELT's themes give no tag.
#             Tags with no gdelt themes (sports, arts) always come from sections.
#             Whole labels, case- and accent-insensitive; "News > Health" counts as "health".
#
# After editing: docker compose exec worker newsroom retag
# (Only themes listed here are stored with articles, so a theme added later applies to
# new articles.)

gdelt_min_mentions: 3

